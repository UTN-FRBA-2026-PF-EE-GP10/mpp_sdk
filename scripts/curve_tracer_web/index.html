<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applies the stored/system theme before first paint, so the page
      // never flashes light-then-dark (or vice versa) on load. Mirrors
      // ThemeProvider's own resolution in src/lib/theme.ts - keep the two
      // in sync if that logic changes.
      ;(function () {
        try {
          var stored = localStorage.getItem('mpp-sdk.theme')
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          // No localStorage/matchMedia (very old or locked-down browser) -
          // fall back to light, same as ThemeProvider's own catch.
        }
      })()
    </script>
