name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Sync dev deps
        # --locked: fail if uv.lock is stale, so CI tests the pinned versions
        run: uv sync --locked --group dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Tests (Python from .python-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Sync project + dev deps
        run: uv sync --locked --group dev --extra pvlib --extra web
      - name: Smoke import
        run: uv run python -c "import mpp_sdk; print(mpp_sdk.__version__)"
      - name: Run pytest
        env:
          MPLBACKEND: Agg
        run: uv run pytest -v --tb=short
