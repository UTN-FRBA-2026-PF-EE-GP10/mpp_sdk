name: Firmware

on:
  push:
    branches: [main]
    paths: [firmware/**]
  pull_request:
    branches: [main]
    paths: [firmware/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: cargo build --release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/pipico_board

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + thumbv6m target
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: thumbv6m-none-eabi
          components: rustfmt, clippy

      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/pipico_board

      - name: Format check
        run: cargo fmt --check

      - name: Build (release)
        run: cargo build --release --locked

      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings

  safety-checks:
    name: safety-checks unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/safety-checks

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt

      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/safety-checks

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

  dimmer-link:
    name: dimmer-link unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/dimmer-link

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
          components: rustfmt, clippy

      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/dimmer-link

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build for the Pico (no_std)
        run: cargo build --release --locked --target thumbv6m-none-eabi
