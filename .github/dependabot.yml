version: 2
# One pull request per ecosystem and kind of change: all minor and patch
# updates together, all major updates together. A broken major bump then
# does not hold back the safe ones.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Rust toolchain is pinned by hand, together with
      # firmware/pipico_board/rust-toolchain.toml, for reproducible firmware
      # builds. dtolnay publishes a tag for each future release too, so
      # Dependabot proposes versions that do not exist yet.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
      python-major:
        update-types: [major]

  - package-ecosystem: cargo
    directories:
      - /firmware/pipico_board
      - /firmware/safety-checks
      - /firmware/esp32c3-bpw34
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
